[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-zonemap"
version = "0.3.0"
description = "Model IEC 62443 zones and conduits as YAML, check them, and draw them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arafat Malik" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zonemap = "zonemap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
